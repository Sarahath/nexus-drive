<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NEXUS DRIVE — Mobile 3D Race</title>
<style>
  :root{--acc:#2ee6d6;--acc2:#ff8a3d;--grn:#2ecc70;--red:#ff3344;--bg:#050a10;--border:rgba(255,255,255,.16);--dim:#8fa3ad}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;padding:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#030508;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
  
  #c{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;z-index:1}
  
  /* ROTATE TO LANDSCAPE HINT */
  @media (orientation: portrait) {
    #rotate-hint { display: flex !important; }
  }
  #rotate-hint {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(3, 5, 8, 0.98);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 2em; text-align: center; color: #fff;
  }
  .rot-icon { font-size: 3.4rem; margin-bottom: 0.8rem; animation: rotAnim 2.2s infinite ease-in-out; }
  @keyframes rotAnim { 0%, 20% { transform: rotate(0deg); } 60%, 80% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
  .rot-ttl { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.08em; color: var(--acc); margin-bottom: 0.5rem; }
  .rot-sub { font-size: 0.85rem; color: var(--dim); max-width: 300px; line-height: 1.5; }

  /* OVERLAYS & HUD */
  #role-tag{position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));
    padding:.35em .85em;border-radius:12px;font-size:.78rem;font-weight:800;letter-spacing:.08em;
    background:rgba(5,15,25,.88);border:1px solid var(--border);backdrop-filter:blur(8px);z-index:10}
  #role-tag.p1{border-color:#ff3344;color:#ff3344;box-shadow:0 0 16px rgba(255,51,68,.35)}
  #role-tag.p2{border-color:#0099ff;color:#0099ff;box-shadow:0 0 16px rgba(0,153,255,.35)}
  
  #fs-btn{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));
    padding:.35em .75em;border-radius:10px;font-size:.75rem;font-weight:800;letter-spacing:.05em;
    background:rgba(5,15,25,.88);border:1px solid var(--border);color:var(--dim);backdrop-filter:blur(8px);z-index:10;cursor:pointer}
  #fs-btn:active{color:var(--acc);border-color:var(--acc)}

  #spd-hub{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    display:flex;align-items:baseline;gap:.4em;background:rgba(5,15,25,.88);padding:.35em 1.2em;border-radius:14px;
    border:1px solid rgba(46,230,214,.35);box-shadow:0 0 18px rgba(46,230,214,.18);backdrop-filter:blur(8px);z-index:10}
  #spd-val{font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums;color:#fff;letter-spacing:-.02em}
  #spd-unit{font-size:.7rem;font-weight:700;color:var(--acc);letter-spacing:.05em}
  #gear-tag{font-size:1.15rem;font-weight:800;background:rgba(46,230,214,.2);color:var(--acc);padding:.15em .55em;border-radius:8px;border:1px solid var(--acc);margin-left:.4em}
  
  #dst-hub{position:fixed;top:calc(56px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    font-size:.78rem;font-weight:700;letter-spacing:.08em;color:var(--acc2);background:rgba(5,15,25,.8);padding:.25em .85em;border-radius:10px;border:1px solid rgba(255,138,61,.2);backdrop-filter:blur(6px);z-index:10}

  /* LIVE MINIMAP HUD */
  #mm-wrap{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    width:88px;height:88px;background:rgba(3,8,15,.85);border:1px solid rgba(46,230,214,.35);border-radius:14px;
    overflow:hidden;box-shadow:0 0 14px rgba(46,230,214,.15);backdrop-filter:blur(6px);z-index:15}
  #mm-canvas{width:100%;height:100%;display:block}

  /* TOUCH CONTROLS */
  .steer{position:fixed;left:calc(16px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:1.1em;z-index:20}
  .steer-btn{width:clamp(82px,15vw,118px);height:clamp(82px,15vw,118px);border-radius:24px;
    display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:var(--dim);
    border:2px solid var(--border);background:rgba(5,15,25,.75);backdrop-filter:blur(8px);touch-action:none;transition:transform .06s,background .08s,color .08s}
  .steer-btn.active{background:radial-gradient(circle,rgba(46,230,214,.4),rgba(46,230,214,.1));
    border-color:var(--acc);box-shadow:0 0 26px rgba(46,230,214,.6);color:var(--acc);transform:scale(.92)}
  
  .pedals{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.9em;align-items:flex-end;z-index:20}
  .pbtn{width:clamp(78px,14.5vw,112px);height:clamp(78px,14.5vw,112px);border-radius:50%;font-size:1.85rem;
    display:flex;align-items:center;justify-content:center;color:var(--dim);border:2px solid var(--border);
    background:rgba(5,15,25,.75);backdrop-filter:blur(8px);touch-action:none;transition:transform .06s,background .08s,color .08s}
  .pbtn.gas.active{background:radial-gradient(circle,rgba(46,204,112,.4),rgba(46,204,112,.1));border-color:var(--grn);box-shadow:0 0 26px rgba(46,204,112,.6);color:var(--grn);transform:scale(.92)}
  .pbtn.brake.active{background:radial-gradient(circle,rgba(255,51,68,.4),rgba(255,51,68,.1));border-color:var(--red);box-shadow:0 0 26px rgba(255,51,68,.6);color:var(--red);transform:scale(.92)}
  
  #hand{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(108px + env(safe-area-inset-bottom));
    padding:.55em 1.8em;border-radius:10px;border:1.5px solid var(--border);color:var(--dim);
    background:rgba(5,15,25,.75);backdrop-filter:blur(6px);font-size:.78rem;font-weight:800;letter-spacing:.1em;z-index:20;touch-action:none}
  #hand.active{border-color:var(--acc2);color:var(--acc2);background:rgba(255,138,61,.2);box-shadow:0 0 20px rgba(255,138,61,.5);transform:translateX(-50%) scale(.95)}

  /* COUNTDOWN & FINISH OVERLAYS */
  #cd-overlay{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(2,6,12,.75);backdrop-filter:blur(8px)}
  #cd-num{font-size:6.5rem;font-weight:900;color:var(--acc);text-shadow:0 0 40px var(--acc);animation:pop .5s ease-out}
  @keyframes pop{0%{transform:scale(.4);opacity:0}80%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  
  #res-overlay{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(2,6,12,.92);backdrop-filter:blur(14px)}
  #res-title{font-size:2.6rem;font-weight:900;letter-spacing:.06em;margin-bottom:.5rem}
  #res-sub{font-size:1rem;color:var(--dim);margin-bottom:1.5rem}
</style>
</head>
<body>

<div id="rotate-hint">
  <div class="rot-icon">🔄</div>
  <div class="rot-ttl">ROTATE TO LANDSCAPE</div>
  <div class="rot-sub">Please hold your phone horizontally for full 3D racing visual and controls.</div>
</div>

<canvas id="c"></canvas>

<div id="role-tag">PLAYER 1</div>
<div id="fs-btn">⛶ FULLSCREEN</div>

<div id="spd-hub">
  <span id="spd-val">0</span><span id="spd-unit">KM/H</span>
  <span id="gear-tag">D1</span>
</div>
<div id="dst-hub">🏁 FINISH: --- M</div>

<div id="mm-wrap">
  <canvas id="mm-canvas" width="128" height="128"></canvas>
</div>

<div class="steer">
  <div class="steer-btn" id="btn-left">◀</div>
  <div class="steer-btn" id="btn-right">▶</div>
</div>
<div class="pedals">
  <div class="pbtn gas" id="btn-gas">▲</div>
  <div class="pbtn brake" id="btn-brake">▼</div>
</div>
<div id="hand">DRIFT</div>

<div id="cd-overlay">
  <div id="cd-num">3</div>
</div>

<div id="res-overlay">
  <div id="res-title">YOU WIN! 🏆</div>
  <div id="res-sub">Waiting for next race…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/config.js?v=20260818_v26"></script>
<script src="js/textures-models.js?v=20260818_v26"></script>
<script src="js/navigation.js?v=20260818_v26"></script>
<script src="js/city-world.js?v=20260818_v26"></script>
<script src="js/car-controller.js?v=20260818_v26"></script>
<script src="js/effects.js?v=20260818_v26"></script>
<script src="js/world-update.js?v=20260818_v26"></script>
<script src="js/audio.js?v=20260818_v26"></script>

<script>
const qs = new URLSearchParams(location.search);
const room = qs.get('room');
const role = qs.get('role') || 'p1'; // 'p1' | 'p2'
const rawServer = qs.get('server');
const serverUrl = rawServer ? (rawServer.endsWith('/ws') ? rawServer : rawServer.replace(/\/$/, '') + '/ws') : (location.origin.replace(/^http/, 'ws') + '/ws');

const roleTag = document.getElementById('role-tag');
roleTag.textContent = role === 'p1' ? '🔴 PLAYER 1 (RED CAR)' : '🔵 PLAYER 2 (BLUE CAR)';
roleTag.className = role;

const spdVal = document.getElementById('spd-val');
const gearTag = document.getElementById('gear-tag');
const dstHub = document.getElementById('dst-hub');
const cdOverlay = document.getElementById('cd-overlay');
const cdNum = document.getElementById('cd-num');
const resOverlay = document.getElementById('res-overlay');
const resTitle = document.getElementById('res-title');

// Fullscreen toggle
document.getElementById('fs-btn').onclick = () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
};

let ws = null;
let racePhase = 'racing'; // starts playable
let input = { throttle: 0, steer: 0, brake: 0, hand: false };

// 3D Scene setup
let myCarMesh, oppCarMesh;
let finishMarker;

const spawnOffsetX = role === 'p1' ? -2.2 : 2.2;
const myCar = {
  pos: new THREE.Vector3(CFG.spawnX + spawnOffsetX, 0, CFG.spawnZ),
  heading: Math.PI / 2,
  speed: 0,
  finished: false
};
const oppCar = {
  pos: new THREE.Vector3(CFG.spawnX + (role === 'p1' ? 2.2 : -2.2), 0, CFG.spawnZ),
  heading: Math.PI / 2,
  speed: 0,
  finished: false
};

const finishPos = { x: CFG.spawnX + 260, z: CFG.spawnZ };

function resizeCanvas() {
  const w = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  if (renderer && driveCam) {
    renderer.setSize(w, h);
    driveCam.aspect = w / h;
    driveCam.updateProjectionMatrix();
  }
}

function init3D() {
  try {
    const canvas = document.getElementById('c');
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.0));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;

    driveCam = new THREE.PerspectiveCamera(58, 16 / 9, 0.1, 400);

    // Build 3D City with photorealistic shaders & textures
    buildCity();
    
    // Create Player Sports Car & Opponent Car
    const myColor = role === 'p1' ? 0xff2233 : 0x1e69d2;
    const oppColor = role === 'p1' ? 0x1e69d2 : 0xff2233;
    
    myCarMesh = mkCar(myColor, 'sport');
    myCarMesh.position.copy(myCar.pos);
    scene.add(myCarMesh);
    
    oppCarMesh = mkCar(oppColor, 'sport');
    oppCarMesh.position.copy(oppCar.pos);
    scene.add(oppCarMesh);
    
    // Finish Archway & Beacon
    finishMarker = mkFinishArch(finishPos);
    scene.add(finishMarker);
    
    const chk = mkCheckpointMarker(finishPos);
    scene.add(chk);

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => { setTimeout(resizeCanvas, 150); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resizeCanvas);
    
    if (typeof Aud !== 'undefined' && Aud.init) Aud.init();
  } catch(e) {
    console.error('Error during 3D initialization:', e);
  }
}

function drawMobileMinimap() {
  const cv = document.getElementById('mm-canvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const S = 128;
  ctx.clearRect(0, 0, S, S);
  ctx.fillStyle = '#030508';
  ctx.fillRect(0, 0, S, S);
  
  const sc = S / 280;
  ctx.save();
  ctx.translate(S / 2, S / 2);
  
  // Road Grid
  ctx.strokeStyle = 'rgba(46,230,214,.22)';
  ctx.lineWidth = 0.8;
  const half = CFG.grid >> 1, roff = CFG.roadW / 2 * sc;
  for (let i = -half; i <= half; i++) {
    const c = i * CFG.cell * sc - roff;
    ctx.beginPath(); ctx.moveTo(c, -500); ctx.lineTo(c, 500); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-500, c); ctx.lineTo(500, c); ctx.stroke();
  }
  
  // Finish Beacon
  const fx = (finishPos.x - CFG.spawnX) * sc, fz = (finishPos.z - CFG.spawnZ) * sc;
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🏁', fx, fz);

  // Opponent Car (P2 if me=P1, else P1)
  const oppX = (oppCar.pos.x - CFG.spawnX) * sc, oppZ = (oppCar.pos.z - CFG.spawnZ) * sc;
  ctx.save();
  ctx.translate(oppX, oppZ);
  ctx.rotate(oppCar.heading - Math.PI / 2);
  ctx.fillStyle = role === 'p1' ? '#1e69d2' : '#ff2233';
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(-3, 4); ctx.lineTo(3, 4); ctx.closePath(); ctx.fill();
  ctx.restore();

  // My Car (Centered with directional arrow)
  const myX = (myCar.pos.x - CFG.spawnX) * sc, myZ = (myCar.pos.z - CFG.spawnZ) * sc;
  ctx.save();
  ctx.translate(myX, myZ);
  ctx.rotate(myCar.heading - Math.PI / 2);
  ctx.fillStyle = role === 'p1' ? '#ff2233' : '#1e69d2';
  ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(-4, 5); ctx.lineTo(4, 5); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();

  ctx.restore();
}

function updatePhysics(dt) {
  if (racePhase === 'countdown') {
    myCar.speed = 0;
    return;
  }
  
  const I = input;
  if (I.throttle > 0.01) {
    if (myCar.speed >= 0) myCar.speed += 19 * I.throttle * dt;
    else myCar.speed += 30 * I.throttle * dt;
  }
  if (I.brake > 0.01) {
    if (myCar.speed > 0.18) myCar.speed -= 36 * I.brake * dt;
    else myCar.speed -= 15 * I.brake * dt;
  }
  if (I.throttle < 0.01 && I.brake < 0.01) {
    const f = 4.8 * dt;
    if (Math.abs(myCar.speed) < f) myCar.speed = 0;
    else myCar.speed -= Math.sign(myCar.speed) * f;
  }
  myCar.speed = clamp(myCar.speed, -12, 54);

  const turnScale = clamp(Math.abs(myCar.speed) / 8.5, 0, 1);
  const driftMul = I.hand ? 2.8 : 1.0;
  const steerDir = (myCar.speed < 0) ? -1 : 1;
  
  // CORRECT STEERING ORIENTATION: Left turns left, Right turns right
  myCar.heading -= I.steer * 2.2 * dt * (0.35 + turnScale * 0.65) * driftMul * steerDir;

  const dx = Math.sin(myCar.heading) * myCar.speed * dt;
  const dz = Math.cos(myCar.heading) * myCar.speed * dt;
  const fwdX = Math.sin(myCar.heading), fwdZ = Math.cos(myCar.heading);
  const dirSign = myCar.speed >= 0 ? 1 : -1;
  const noseLen = 2.2, noseR = 1.1;

  const halfSpan = CFG.span / 2 - 8;
  const targetX = clamp(myCar.pos.x + dx, -halfSpan, halfSpan);
  const targetZ = clamp(myCar.pos.z + dz, -halfSpan, halfSpan);

  const hitX = typeof hits === 'function' ? hits(targetX + fwdX * noseLen * dirSign, myCar.pos.z + fwdZ * noseLen * dirSign, noseR) : false;
  if (!hitX) {
    myCar.pos.x = targetX;
  } else {
    myCar.speed *= -0.25;
    if (typeof spawnImpactFX === 'function') spawnImpactFX({ x: myCar.pos.x + fwdX * 1.5, y: 0.75, z: myCar.pos.z + fwdZ * 1.5 }, 0xffaa33, 22, 6.5, 0.7, 0.28);
    if (typeof Aud !== 'undefined' && Aud.crash) Aud.crash();
  }

  const hitZ = typeof hits === 'function' ? hits(myCar.pos.x + fwdX * noseLen * dirSign, targetZ + fwdZ * noseLen * dirSign, noseR) : false;
  if (!hitZ) {
    myCar.pos.z = targetZ;
  } else {
    myCar.speed *= -0.25;
    if (typeof spawnImpactFX === 'function') spawnImpactFX({ x: myCar.pos.x + fwdX * 1.5, y: 0.75, z: myCar.pos.z + fwdZ * 1.5 }, 0xffaa33, 22, 6.5, 0.7, 0.28);
    if (typeof Aud !== 'undefined' && Aud.crash) Aud.crash();
  }

  if (myCarMesh) {
    myCarMesh.position.copy(myCar.pos);
    myCarMesh.rotation.y = myCar.heading;
  }
  if (oppCarMesh) {
    oppCarMesh.position.copy(oppCar.pos);
    oppCarMesh.rotation.y = oppCar.heading;
  }

  // Update HUD
  const kmh = Math.round(Math.abs(myCar.speed) * 3.6);
  spdVal.textContent = kmh;
  gearTag.textContent = myCar.speed < -0.2 ? 'R' : (kmh < 2 ? 'N' : (kmh < 35 ? 'D1' : (kmh < 70 ? 'D2' : (kmh < 100 ? 'D3' : (kmh < 130 ? 'D4' : 'D5')))));
  
  const dist = Math.round(Math.hypot(myCar.pos.x - finishPos.x, myCar.pos.z - finishPos.z));
  dstHub.textContent = `🏁 FINISH: ${dist} M`;

  // Check finish line
  if (!myCar.finished && dist <= 9.5) {
    myCar.finished = true;
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'mp-finish', role }));
    }
  }

  // Update Engine Audio
  if (typeof Aud !== 'undefined' && Aud.update) {
    Aud.update(myCar.speed / 48, I.throttle);
  }

  // Update Chase Camera
  if (driveCam) {
    const back = 7.8, height = 2.4;
    driveCam.position.set(myCar.pos.x - Math.sin(myCar.heading) * back, height, myCar.pos.z - Math.cos(myCar.heading) * back);
    driveCam.lookAt(myCar.pos.x + Math.sin(myCar.heading) * 5, 1.2, myCar.pos.z + Math.cos(myCar.heading) * 5);
  }
}

let lastT = performance.now();
function animLoop(now) {
  requestAnimationFrame(animLoop);
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;

  updatePhysics(dt);
  drawMobileMinimap();
  if (typeof updateFX === 'function') updateFX(dt);
  if (renderer && scene && driveCam) renderer.render(scene, driveCam);
}

// WebSocket Relay Connection
function connectRelay() {
  if (!room) return;
  try {
    ws = new WebSocket(serverUrl);
  } catch (e) {
    setTimeout(connectRelay, 2000);
    return;
  }
  
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'join', room, role }));
  };
  
  ws.onmessage = (ev) => {
    let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.type === 'mp-state') {
      if (d.state === 'countdown') {
        racePhase = 'countdown';
        cdOverlay.style.display = 'flex';
        cdNum.textContent = d.count > 0 ? d.count : 'GO!';
      } else if (d.state === 'go') {
        racePhase = 'racing';
        cdOverlay.style.display = 'none';
      } else if (d.state === 'finished') {
        racePhase = 'finished';
        resOverlay.style.display = 'flex';
        const won = d.winner === role;
        resTitle.textContent = won ? '🏆 YOU WIN!' : '🥈 2ND PLACE';
        resTitle.style.color = won ? 'var(--grn)' : 'var(--acc2)';
      }
    } else if (d.type === 'mp-pos' && d.role !== role) {
      // Opponent car position update
      oppCar.pos.x = d.x;
      oppCar.pos.z = d.z;
      oppCar.heading = d.heading;
      oppCar.speed = d.speed;
    }
  };
  
  ws.onclose = () => {
    setTimeout(connectRelay, 2000);
  };
}

// Send position update loop
setInterval(() => {
  if (ws && ws.readyState === 1 && racePhase === 'racing') {
    ws.send(JSON.stringify({
      type: 'mp-pos',
      role,
      x: myCar.pos.x,
      z: myCar.pos.z,
      heading: myCar.heading,
      speed: myCar.speed,
      throttle: input.throttle,
      steer: input.steer,
      brake: input.brake
    }));
  }
}, 45);

// Touch Controls Binding (Steer Left: -1, Steer Right: +1)
function bindHold(id, onDown, onUp) {
  const el = document.getElementById(id);
  if (!el) return;
  const down = (e) => { e.preventDefault(); el.classList.add('active'); onDown(); };
  const up = (e) => { e.preventDefault(); el.classList.remove('active'); onUp(); };
  el.addEventListener('pointerdown', down, { passive: false });
  el.addEventListener('pointerup', up, { passive: false });
  el.addEventListener('pointercancel', up, { passive: false });
  el.addEventListener('pointerleave', up, { passive: false });
  el.addEventListener('touchstart', down, { passive: false });
  el.addEventListener('touchend', up, { passive: false });
  el.addEventListener('touchcancel', up, { passive: false });
}

let leftDown = false, rightDown = false;
bindHold('btn-left', () => { leftDown = true; input.steer = -1; }, () => { leftDown = false; input.steer = rightDown ? 1 : 0; });
bindHold('btn-right', () => { rightDown = true; input.steer = 1; }, () => { rightDown = false; input.steer = leftDown ? -1 : 0; });
bindHold('btn-gas', () => input.throttle = 1, () => input.throttle = 0);
bindHold('btn-brake', () => input.brake = 1, () => input.brake = 0);
bindHold('hand', () => input.hand = true, () => input.hand = false);

window.addEventListener('DOMContentLoaded', () => {
  init3D();
  connectRelay();
  requestAnimationFrame(animLoop);
});
</script>
</body>
</html>
