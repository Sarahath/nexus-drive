<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nexus Drive — Landscape Controller</title>
<style>
  :root{--acc:#2ee6d6;--acc2:#ff8a3d;--grn:#2ecc70;--red:#ff3344;--bg:#050a10;--border:rgba(255,255,255,.14);--dim:#8fa3ad}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;height:100%;width:100%;background:var(--bg);color:#eaf6f6;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
  
  /* ROTATE TO LANDSCAPE HINT */
  @media (orientation: portrait) {
    #rotate-hint { display: flex !important; }
  }
  #rotate-hint {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(3, 5, 8, 0.97);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 2em; text-align: center; color: #fff;
  }
  .rot-icon { font-size: 3.2rem; margin-bottom: 0.8rem; animation: rotAnim 2.2s infinite ease-in-out; }
  @keyframes rotAnim { 0%, 20% { transform: rotate(0deg); } 60%, 80% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
  .rot-ttl { font-size: 1.2rem; font-weight: 800; letter-spacing: 0.08em; color: var(--acc); margin-bottom: 0.5rem; }
  .rot-sub { font-size: 0.82rem; color: var(--dim); max-width: 290px; line-height: 1.5; }

  #status{position:absolute;top:calc(8px + env(safe-area-inset-top));left:0;right:0;text-align:center;
    font-size:.78rem;letter-spacing:.03em;color:var(--dim);z-index:5;padding:0 1em}
  #status.ok{color:var(--grn)}#status.err{color:var(--red)}
  #role-badge{position:absolute;top:calc(8px + env(safe-area-inset-top));left:14px;font-size:.68rem;
    padding:.25em .65em;border-radius:18px;border:1px solid var(--border);letter-spacing:.05em;z-index:5}
  #role-badge.p1{border-color:var(--acc);color:var(--acc)}
  #role-badge.p2{border-color:var(--acc2);color:var(--acc2)}
  
  #wrap{position:relative;height:100%;width:100%;display:none}
  #wrap.show{display:block}
  
  /* LEFT STEERING BUTTONS */
  .steer{position:absolute;left:calc(16px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));
    display:flex;gap:1em;z-index:10}
  .steer-btn{width:clamp(80px,15vw,115px);height:clamp(80px,15vw,115px);border-radius:20px;
    display:flex;align-items:center;justify-content:center;font-size:2.4rem;color:var(--dim);
    border:2px solid var(--border);background:rgba(255,255,255,.05);touch-action:none;transition:transform .06s,box-shadow .08s,background .08s,color .08s}
  .steer-btn.active{background:radial-gradient(circle,rgba(46,230,214,.4),rgba(46,230,214,.1));
    border-color:var(--acc);box-shadow:0 0 26px rgba(46,230,214,.6);color:var(--acc);transform:scale(.92)}
  
  /* RIGHT PEDALS (GAS / BRAKE) */
  .pedals{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:.8em;align-items:flex-end;z-index:10}
  .pbtn{width:clamp(78px,14.5vw,110px);height:clamp(78px,14.5vw,110px);border-radius:50%;font-size:1.8rem;
    display:flex;align-items:center;justify-content:center;color:var(--dim);border:2px solid var(--border);
    background:rgba(255,255,255,.05);touch-action:none;transition:transform .06s,box-shadow .08s,background .08s,color .08s}
  .pbtn.gas.active{background:radial-gradient(circle,rgba(46,204,112,.4),rgba(46,204,112,.1));border-color:var(--grn);box-shadow:0 0 26px rgba(46,204,112,.6);color:var(--grn);transform:scale(.92)}
  .pbtn.brake.active{background:radial-gradient(circle,rgba(255,51,68,.4),rgba(255,51,68,.1));border-color:var(--red);box-shadow:0 0 26px rgba(255,51,68,.6);color:var(--red);transform:scale(.92)}
  
  /* EXTRAS / ACTIONS */
  #extras{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));
    display:flex;gap:.5em;z-index:10;max-width:94vw;flex-wrap:wrap;justify-content:center}
  .mini{padding:.35em .65em;border-radius:10px;border:1px solid var(--border);background:rgba(5,15,25,.85);
    color:var(--dim);display:flex;align-items:center;gap:.3em;font-size:.72rem;letter-spacing:.04em;touch-action:none}
  .mini:active{border-color:var(--acc);color:var(--acc);background:rgba(46,230,214,.15);transform:scale(.95)}
  
  #mode-bar{position:absolute;top:calc(8px + env(safe-area-inset-top));right:14px;display:flex;gap:.4em;z-index:6}
  .mbar-btn{font-size:.65rem;font-weight:700;padding:.3em .6em;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--dim);touch-action:none}
  .mbar-btn:active{border-color:var(--acc);color:var(--acc);background:rgba(46,230,214,.2)}
  
  #hand{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
    padding:.65em 2em;border-radius:12px;border:2px solid var(--border);color:var(--dim);
    background:rgba(255,255,255,.04);font-size:.82rem;font-weight:800;letter-spacing:.1em;z-index:10;touch-action:none}
  #hand.active{border-color:var(--acc2);color:var(--acc2);background:rgba(255,138,61,.2);box-shadow:0 0 22px rgba(255,138,61,.5);transform:translateX(-50%) scale(.95)}
  
  #telemetry{position:absolute;left:50%;transform:translateX(-50%);top:calc(38px + env(safe-area-inset-top));
    display:flex;align-items:center;gap:.6em;background:rgba(5,15,25,.88);padding:.35em 1.2em;border-radius:16px;border:1px solid rgba(46,230,214,.3);box-shadow:0 0 16px rgba(46,230,214,.15);z-index:4}
  #spd-val{font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums;color:#fff;letter-spacing:-.02em}
  #spd-unit{font-size:.7rem;font-weight:700;color:var(--acc);letter-spacing:.05em}
  #gear-badge{font-size:1.2rem;font-weight:800;background:rgba(46,230,214,.2);color:var(--acc);padding:.18em .65em;border-radius:8px;border:1px solid var(--acc)}
  .gear-btn{padding:.35em .65em;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.08);color:#fff;font-size:.78rem;font-weight:800;touch-action:none}
  .gear-btn:active{background:rgba(46,230,214,.3);border-color:var(--acc);color:var(--acc);transform:scale(.92)}
  
  #joinScreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em;padding:1.5em;text-align:center}
  #mpOverlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(5,10,16,.92);font-size:2.4rem;font-weight:700;letter-spacing:.05em;z-index:10}
  #mpOverlay.show{display:flex}
  #mpOverlay .sub{font-size:1rem;color:var(--dim);margin-top:.6em;font-weight:400}
</style>
</head>
<body>

<div id="rotate-hint">
  <div class="rot-icon">🔄</div>
  <div class="rot-ttl">ROTATE TO LANDSCAPE</div>
  <div class="rot-sub">Please hold your phone horizontally (Landscape) for full racing controls.</div>
</div>

<div id="joinScreen">
  <div style="font-size:1.1rem;letter-spacing:.05em">NEXUS DRIVE CONTROLLER</div>
  <div id="joinMsg" style="color:var(--dim);font-size:.85rem">Connecting…</div>
</div>

<div id="role-badge"></div>
<div id="mode-bar">
  <div class="mbar-btn" id="mb-free">🏎️ FREE</div>
  <div class="mbar-btn" id="mb-mis">🎯 MISSION</div>
</div>
<div id="status">Connecting…</div>

<div id="wrap">
  <div id="telemetry">
    <div class="gear-btn" id="btn-gdn">▼ G-</div>
    <span id="gear-badge">D1</span>
    <div class="gear-btn" id="btn-gup">▲ G+</div>
    <span id="spd-val" style="margin-left:.4em">0</span><span id="spd-unit">KM/H</span>
  </div>
  <div id="extras">
    <div class="mini" id="mi-cam">🎥 CAM</div>
    <div class="mini" id="mi-wx">🌧️ WX</div>
    <div class="mini" id="mi-lights">💡 LIGHTS</div>
    <div class="mini" id="mi-horn">📯 HORN</div>
    <div class="mini" id="mi-recover">↺ RESET</div>
  </div>
  <div class="steer">
    <div class="steer-btn" id="btn-left">◀</div>
    <div class="steer-btn" id="btn-right">▶</div>
  </div>
  <div class="pedals">
    <div class="pbtn gas" id="btn-gas">▲</div>
    <div class="pbtn brake" id="btn-brake">▼</div>
  </div>
  <div id="hand">DRIFT</div>
</div>

<div id="mpOverlay">
  <div id="mpOverlayText">3</div>
  <div class="sub" id="mpOverlaySub"></div>
</div>

<script>
const qs = new URLSearchParams(location.search);
const room = qs.get('room');
const role = qs.get('role'); // 'p1' | 'p2' | null (phone control)
const rawServer = qs.get('server');
const serverUrl = rawServer ? (rawServer.endsWith('/ws') ? rawServer : rawServer.replace(/\/$/, '') + '/ws') : (location.origin.replace(/^http/, 'ws') + '/ws');

const statusEl = document.getElementById('status');
const joinScreen = document.getElementById('joinScreen');
const joinMsg = document.getElementById('joinMsg');
const wrap = document.getElementById('wrap');
const badge = document.getElementById('role-badge');
const spdVal = document.getElementById('spd-val');
const gearBadge = document.getElementById('gear-badge');
const modeBar = document.getElementById('mode-bar');

if (role) {
  badge.textContent = role === 'p1' ? 'PLAYER 1 (RED CAR)' : 'PLAYER 2 (BLUE CAR)';
  badge.classList.add(role);
  modeBar.style.display = 'none';
  document.getElementById('extras').style.display = 'none';
} else {
  badge.textContent = '📱 WHOLE GAME CONTROLLER';
  badge.style.borderColor = 'var(--grn)';
  badge.style.color = 'var(--grn)';
}

function calcGear(kmh, thr, brk){
  if(brk > 0.5 && kmh < 2) return 'R';
  if(kmh < 2) return 'N';
  if(kmh < 35) return 'D1';
  if(kmh < 70) return 'D2';
  if(kmh < 100) return 'D3';
  if(kmh < 130) return 'D4';
  return 'D5';
}

let ws = null, joined = false;
let throttle = 0, steer = 0, brake = 0, hand = false;
let curSpeedKmh = 0;

function connect() {
  if (!room) { joinMsg.textContent = 'Missing room code in link.'; return; }
  try {
    ws = new WebSocket(serverUrl);
  } catch (e) {
    joinMsg.textContent = 'Invalid server address.'; return;
  }
  ws.onopen = () => { ws.send(JSON.stringify({ type: 'join', room, role: role || undefined })); };
  ws.onclose = () => {
    joined = false; wrap.classList.remove('show'); joinScreen.style.display = 'flex';
    statusEl.textContent = 'Disconnected — retrying…'; statusEl.className = 'err';
    setTimeout(connect, 2000);
  };
  ws.onerror = () => { statusEl.textContent = 'Connection error'; statusEl.className = 'err'; };
  ws.onmessage = (ev) => {
    let d; try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.type === 'joined') {
      joined = true; joinScreen.style.display = 'none'; wrap.classList.add('show');
      statusEl.textContent = role ? 'Connected — waiting for race start…' : 'Connected ✓';
      statusEl.className = 'ok';
      startSending();
    } else if (d.type === 'host-left') {
      statusEl.textContent = 'Host disconnected'; statusEl.className = 'err';
    } else if (d.type === 'telemetry') {
      if (!role || d.role === role) {
        curSpeedKmh = Math.round(d.speed || 0);
        spdVal.textContent = curSpeedKmh;
        gearBadge.textContent = d.gear || calcGear(curSpeedKmh, throttle, brake);
      }
    } else if (d.type === 'mp-state') {
      const ov = document.getElementById('mpOverlay'), txt = document.getElementById('mpOverlayText'), sub = document.getElementById('mpOverlaySub');
      if (d.state === 'countdown') {
        ov.classList.add('show'); txt.textContent = d.count > 0 ? d.count : 'GO!'; sub.textContent = '';
      } else if (d.state === 'go') {
        ov.classList.remove('show');
      } else if (d.state === 'finished') {
        ov.classList.add('show');
        const won = d.winner === role;
        txt.textContent = won ? 'YOU WIN! 🏆' : 'YOU LOSE';
        sub.textContent = 'Waiting for next race…';
      }
    }
  };
}

function bindHold(id, onDown, onUp) {
  const el = document.getElementById(id);
  if (!el) return;
  
  const handleDown = (e) => {
    e.preventDefault();
    el.classList.add('active');
    onDown();
  };
  const handleUp = (e) => {
    e.preventDefault();
    el.classList.remove('active');
    onUp();
  };
  
  el.addEventListener('pointerdown', handleDown, {passive: false});
  el.addEventListener('pointerup', handleUp, {passive: false});
  el.addEventListener('pointercancel', handleUp, {passive: false});
  el.addEventListener('pointerleave', handleUp, {passive: false});
  
  el.addEventListener('touchstart', handleDown, {passive: false});
  el.addEventListener('touchend', handleUp, {passive: false});
  el.addEventListener('touchcancel', handleUp, {passive: false});
}

let leftDown = false, rightDown = false;
bindHold('btn-left', () => { leftDown = true; steer = (rightDown ? 1 : 0) - 1; sendInstant(); }, () => { leftDown = false; steer = (rightDown ? 1 : 0) - (leftDown ? 1 : 0); sendInstant(); });
bindHold('btn-right', () => { rightDown = true; steer = 1 - (leftDown ? 1 : 0); sendInstant(); }, () => { rightDown = false; steer = (rightDown ? 1 : 0) - (leftDown ? 1 : 0); sendInstant(); });
bindHold('btn-gas', () => { throttle = 1; sendInstant(); }, () => { throttle = 0; sendInstant(); });
bindHold('btn-brake', () => { brake = 1; sendInstant(); }, () => { brake = 0; sendInstant(); });
bindHold('hand', () => { hand = true; sendInstant(); }, () => { hand = false; sendInstant(); });

let pendingAction = null;
const tap = (id, action) => {
  const el = document.getElementById(id);
  if (el) {
    const handleTap = (e) => {
      e.preventDefault();
      pendingAction = action;
      sendInstant();
    };
    el.addEventListener('pointerdown', handleTap, {passive: false});
    el.addEventListener('touchstart', handleTap, {passive: false});
  }
};
tap('mi-horn', 'horn');
tap('mi-lights', 'headlights');
tap('mi-cam', 'camera');
tap('mi-wx', 'weather');
tap('mi-recover', 'recover');
tap('mb-free', 'free-mode');
tap('mb-mis', 'mission-mode');
tap('btn-gup', 'gear-up');
tap('btn-gdn', 'gear-down');

function sendInstant() {
  if (!ws || ws.readyState !== 1) return;
  if (role) {
    ws.send(JSON.stringify({ type: 'mp-input', throttle, steer, brake, hand }));
  } else {
    const msg = { type: 'input', throttle, steer, brake, hand };
    if (pendingAction) { msg.action = pendingAction; pendingAction = null; }
    ws.send(JSON.stringify(msg));
  }
}

let sendTimer = null;
function startSending() {
  if (sendTimer) return;
  sendTimer = setInterval(() => {
    sendInstant();
  }, 45);
}

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

connect();
</script>
</body>
</html>
